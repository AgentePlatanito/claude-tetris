name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are triaging issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the issue's title and body.
            2. Read CLAUDE.md and the relevant source files (game.js, index.html, style.css) to
               understand this project's architecture before forming an opinion.
            3. Apply the label(s) that best fit the issue, using GitHub's default label set
               (bug, enhancement, question, documentation, duplicate, invalid, wontfix,
               good first issue, help wanted). Only create a new label if none of the default
               ones reasonably fit.
            4. Post a general diagnosis as an issue comment, covering:
               - A short summary of the problem/request.
               - The likely root cause or relevant area, referencing specific files/functions
                 (e.g. collide(), tryRotate(), clearLines(), the render/draw functions, the
                 game loop, etc.) where applicable.
               - What would need to change to address it.
               Do NOT implement a fix — this is diagnosis only, to be used later as the basis
               for the actual code change.
               Write the comment in Markdown format that GitHub can render (e.g. headings,
               bullet lists, and code spans/blocks for file and function names).
            5. If Claude has already posted a diagnosis comment on this issue (this can happen
               when the issue is edited after the first triage), update/edit that existing
               comment instead of creating a new one, so comments don't pile up across edits.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
